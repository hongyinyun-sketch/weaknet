name: Build WeakNet exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pydivert keyboard pystray pillow pyinstaller
      - name: Build exe
        run: python -m PyInstaller -F -w --uac-admin --collect-all pydivert --name WeakNet weaknet.py
      - uses: actions/upload-artifact@v4
        with:
          name: WeakNet
          path: dist/WeakNet.exe
